cargo-features = ["panic-immediate-abort"]

[workspace]
members = [
    "models",
    "rtl",
    "crypto",
    "sys",
    "sec",
    "io",
    "ironwood",
    "ironwood-receive",
    "upymod",
    "rust",
    "projects/*",
    "xbuild",
    "xtask",
]

resolver = "3"

[profile.dev]
panic = "abort"
split-debuginfo = "off"
debug = 2

[profile.debug-opt] # size optimized debug build
inherits = "dev"
panic = "abort"
opt-level = "z"
lto = true
codegen-units = 1
split-debuginfo = "off"
debug = 2

[profile.release]
panic = "immediate-abort"
opt-level = "z"
lto = true
codegen-units = 1
split-debuginfo = "off"
debug = 2

[profile.release.package.trezor-tjpgdec]
opt-level = 3

[profile.test]
split-debuginfo = "off"
debug = 2

# Optimized profile for build related binaries
[profile.release.build-override]
debug = false
strip = true
opt-level = "s"

# Optimized profile for build related binaries
[profile.dev.build-override]
debug = false
strip = true
opt-level = "s"

# Optimized profile for xtask binary
[profile.xtask]
inherits = "dev"
debug = false
strip = true

[workspace.dependencies]
aes = { version = "=0.8.4", default-features = false, features = ["zeroize"] }
blake2b_simd = { version = "=1.0.2", default-features = false, features = ["uninline_portable"] }
cfg-if = "1.0"
cty = "0.2.2"
easer = { version = "0.3.0", default-features = false, features = ["libm"] }
heapless = { version = "0.9.2", features = ["ufmt"], default-features = false }
log = { version = "0.4.29", features = ["max_level_trace", "release_max_level_off"] }
minicbor = { version = "1.0.0", default-features = false }
num-derive = "0.4.2"
num-traits = { version = "0.2.19", default-features = false, features = ["libm"] }
ironwood-pasta-curves = { package = "pasta_curves", version = "=0.5.1", default-features = false, features = ["uninline-portable"] }
ironwood-sinsemilla = { package = "sinsemilla", version = "=0.1.0", default-features = false, features = ["computed-generators"] }
orchard = { version = "=0.15.3", default-features = false }
trezor-pasta-curves = { package = "pasta_curves", git = "https://github.com/jarys/pasta_curves", rev = "e11dfe4089d0da24483094a99cceb89f32974c17", default-features = false, features = ["uninline-portable"] }
pareen = { version = "0.3.3", path = "../../rust/pareen", default-features = false, features = ["libm", "easer"] }
pczt = { version = "=0.9.3", default-features = false, features = ["orchard"] }
qrcodegen-no-heap = { version = "1.8.1", path = "../vendor/QR-Code-generator/rust-no-heap" }
rand_chacha = { version = "=0.3.1", default-features = false }
rand_core = { version = "=0.6.4", default-features = false }
sapling = { package = "sapling-crypto", version = "=0.7.0", default-features = false }
spin = { version = "0.9.9", features = ["rwlock", "spin_mutex", "lazy"], default-features = false }
static-alloc = "0.2.6"
transparent = { package = "zcash_transparent", version = "=0.10.0", default-features = false }
trezor-ironwood-receive = { path = "ironwood-receive", default-features = false }
trezor-ironwood = { path = "ironwood", default-features = false }
trezor-thp = { path = "../../rust/trezor-thp" }
trezor-tjpgdec = { version = "0.1.0", path = "../../rust/trezor-tjpgdec" }
ufmt = "0.2.0"
unsize = "1.1.0"
without-alloc = "0.2.2"
zcash_note_encryption = { version = "=0.4.1", default-features = false }
zcash_primitives = { version = "=0.30.1", default-features = false }
zcash_protocol = { version = "=0.10.5", default-features = false }
zeroize = { version = "1.8.2", default-features = false, features = ["zeroize_derive"] }

models = { path = "models" }
rtl = { path = "rtl" }
crypto = { path = "crypto" }
sys = { path = "sys" }
sec = { path = "sec" }
io = { path = "io" }
upymod = { path = "upymod" }
trezor_lib = { path = "rust", default-features = false }

# xbuild and xtask dependencies

anyhow = "1.0"
bindgen = { version = "0.72.1", default-features = false, features = ["runtime"] }
cargo_metadata = "0.23.1"
cc = "1.0.69"
clap = { version = "4.6.0", default-features = false }
color-eyre = { version = "0.6.5", default-features = false, features = ["track-caller"] }
glob = "0.3.0"
globset = "0.4.18"
hex = "0.4.3"
owo-colors = "4.3.0"
pathdiff = "0.2.3"
pkg-config = "0.3.28"
rand = { version = "0.10.1", default-features = false }
serde = "1.0.228"
serde_json = "1.0.145"
tempfile = { version = "3.25.0", default-features = false }
toml = "0.8.23"
zlib-rs = "0.6.3"

xbuild = { path = "xbuild" }

[patch.crates-io]
# Signing flash probe only: exact-base Sinsemilla computed-generators commit on the user fork, pinned by full SHA.
sinsemilla = { git = "https://github.com/bawolf/sinsemilla", rev = "6ca88ff52835899c87ff83489b95c5cda887e8a4" }
# Signing flash probe only: exact-base Orchard direct-scope classifier commit on the user fork, pinned by full SHA.
orchard = { git = "https://github.com/bawolf/orchard", rev = "19f6100607e9dfacc10f0fe0d4ac84fb79f610c5" }
