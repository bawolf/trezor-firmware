syntax = "proto2";
package hw.trezor.zcash;

/**
 * Request: Ask device for a Zcash unified address with an Orchard receiver
 * @start
 * @next Address
 * @next Failure
 */
message GetAddress {
    repeated uint32 address_n = 1;         // ZIP-32 account path m/32'/coin_type'/account'
    required bytes diversifier_index = 2;  // 11 bytes, little-endian
    optional bool chunkify = 3;            // Display the address in chunks of 4 characters
}

/**
 * Response: Contains a unified address, confirmed on the device
 * @end
 */
message Address {
    required string address = 1;
}

/**
 * Request: Ask device for an Orchard-only unified full viewing key
 * @start
 * @next ViewingKey
 * @next Failure
 */
message GetViewingKey {
    repeated uint32 address_n = 1;                                // ZIP-32 account path m/32'/coin_type'/account'
    optional bool include_seed_fingerprint = 2 [default = false];  // Also export the ZIP-32 seed fingerprint
}

/**
 * Response: Contains the unified full viewing key, and the seed fingerprint if requested
 * @end
 */
message ViewingKey {
    required string key = 1;
    optional bytes seed_fingerprint = 2;
}

/**
 * Request: Ask device to sign the Ironwood spends of a PCZT, which it requests in chunks
 * @start
 * @next PcztRequest
 * @next Failure
 */
message SignPczt {
    repeated uint32 address_n = 1;              // ZIP-32 account path m/32'/coin_type'/account'
    // prost reads an absent required field as 0, which both refuse.
    required uint32 pczt_length = 2;            // PCZT size in bytes
    required uint32 host_reference_height = 3;  // Chain height the host builds on; bounds the expiry height
}

/**
 * Response: Device requests the next chunk of the PCZT
 * @next PcztAck
 * @next Cancel
 */
message PcztRequest {
    required bytes transfer_id = 1;  // 16 random bytes, the same for every chunk of one PCZT
    required uint32 offset = 2;
    required uint32 length = 3;      // At most 1024
}

/**
 * Request: Host sends the requested chunk; all fields are required
 * @next PcztRequest
 * @next SpendAuthSignatures
 * @next Failure
 */
message PcztAck {
    // transfer_id and offset repeat the request's, binding the chunk to it.
    // Optional so that an absent offset is not read as 0.
    optional bytes transfer_id = 1;
    optional uint32 offset = 2;
    optional bytes data = 3;
}

/**
 * Request: Host cancels signing, in place of a PcztAck
 * @next Failure
 */
message Cancel {
}

/**
 * Response: Spend authorization signatures of the PCZT's real Ironwood spends
 * @end
 */
message SpendAuthSignatures {
    required bytes transfer_id = 1;
    repeated SpendAuthSignature signatures = 2;  // In ascending action order

    message SpendAuthSignature {
        required uint32 action_index = 1;
        required bytes signature = 2;  // 64-byte RedPallas signature
    }
}
