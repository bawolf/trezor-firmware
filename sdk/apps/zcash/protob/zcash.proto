syntax = "proto2";
package hw.trezor.messages.zcash;

// Every request field marked "required:" below must be present, so that an
// omitted scalar cannot silently become zero (network or account zero, a PCZT
// chunk at offset zero). They are `optional` because prost does not enforce
// proto2 `required` and would decode an absent field as zero; the app rejects
// an absent field itself. The other optional fields are opt-ins: an extra
// export (include_seed_fingerprint) or a screen-formatting preference
// (chunkify). Absent means off.

/**
 * Network selecting the coin type and the encodings. MAINNET maps to coin
 * type 133, TESTNET to coin type 1. There is deliberately no Regtest value.
 */
enum ZcashNetwork {
    ZcashNetwork_Mainnet = 0;
    ZcashNetwork_Testnet = 1;
}

/**
 * Request: Ask device for a Zcash Unified Address.
 * Retrieval always performs trusted on-device confirmation of the complete
 * canonical address; there is no show_display=false path.
 * @start
 * @next ZcashAddress
 * @next Failure
 */
message ZcashGetAddress {
    optional ZcashNetwork network = 1;     // required: selects coin type and address encoding
    optional uint32 account = 2;           // required: ZIP-32 account index in 0..2^31-1; the device
                                           // derives m/32'/coin_type'/account' itself
    optional bytes diversifier_index = 3;  // required: exactly 11 bytes, little-endian
    optional bool chunkify = 4;            // display the address in chunks of 4 characters
}

/**
 * Response: Canonical network-encoded Unified Address containing the receiver
 * shared by Orchard and Ironwood. Released only after on-device confirmation.
 * @end
 */
message ZcashAddress {
    required string address = 1;
}

/**
 * Request: Ask device for an Orchard-only Unified Full Viewing Key.
 * A dedicated on-device privacy confirmation is mandatory for every export,
 * and a second one when the seed fingerprint is requested as well.
 * @start
 * @next ZcashViewingKey
 * @next Failure
 */
message ZcashGetViewingKey {
    optional ZcashNetwork network = 1;  // required
    optional uint32 account = 2;        // required: ZIP-32 account index in 0..2^31-1
    // Also export the ZIP-32 seed fingerprint. Off by default: the
    // fingerprint identifies the seed, not the account, so requesting it
    // adds a second on-device warning saying so.
    optional bool include_seed_fingerprint = 3 [default = false];
}

/**
 * Response: One network-encoded, Orchard-only UFVK for the selected account.
 * It contains no transparent or Sapling component, no seed, no spending key,
 * and no spend-authorizing scalar. Possession can reveal and link wallet
 * activity and can derive the account's viewing material and addresses, but
 * cannot confer spend authority.
 * seed_fingerprint is the ZIP-32 seed fingerprint of the wallet seed
 * (BLAKE2b-256 of the seed under the ZIP-32 personalization): a public
 * identifier, not key material. It is present only when the request set
 * include_seed_fingerprint, and is then released behind an additional
 * on-device warning, because unlike the account viewing key it identifies the
 * seed: it is the same value for every account index and for both networks,
 * so a host that holds it can link all of this wallet's Zcash accounts.
 * @end
 */
message ZcashViewingKey {
    required string key = 1;
    optional bytes seed_fingerprint = 2;  // exactly 32 bytes when present
}

/**
 * Request: Ask device to sign the Ironwood spends of a PCZT, which the device
 * pulls in chunks with ZcashPcztRequest. The device reviews each payment as
 * it arrives and the totals at the end, and returns detached signatures; it
 * never returns the PCZT.
 * @start
 * @next ZcashPcztRequest
 * @next Failure
 */
message ZcashSignPczt {
    optional ZcashNetwork network = 1;              // required
    optional uint32 account = 2;                    // required: ZIP-32 account index in 0..2^31-1
    optional uint32 pczt_length = 3;                // required: total upload length, 1..65536
    optional uint32 host_reference_height = 4;      // required: host assertion only: NOT a header,
                                                    // checkpoint, proof, or authenticated statement
                                                    // of chain state
}

/**
 * Response: Device requests one contiguous chunk of the uploaded PCZT.
 * Requests advance contiguously from offset zero to the declared length with
 * no gaps, duplicates, sparse writes, blind retry, or resume tokens.
 * @next ZcashPcztAck
 * @next ZcashCancel
 */
message ZcashPcztRequest {
    required bytes transfer_id = 1;  // exactly 16 bytes, fresh per request
    required uint32 offset = 2;
    required uint32 length = 3;      // exactly min(1024, remaining)
    optional ZcashDiagnostics diagnostics = 4;  // debug builds only: the counters so far,
                                                // kept by the host if Core stops the app
}

/**
 * Request: Host supplies the exact requested chunk.
 * @next ZcashPcztRequest
 * @next ZcashSpendAuthSignatures
 * @next Failure
 */
message ZcashPcztAck {
    optional bytes transfer_id = 1;  // required: repeats the requested transfer ID exactly
    optional uint32 offset = 2;      // required: repeats the requested offset exactly
    optional bytes data = 3;         // required: exactly the requested length
}

/**
 * Request: Abandon the signing request in progress, in place of a
 * ZcashPcztAck. The device answers Failure(ActionCancelled), also when no
 * request is in progress.
 * @next Failure
 */
message ZcashCancel {
}

/**
 * Response: Spend authorization signatures for every real Ironwood spend of
 * the uploaded PCZT, sent only once all of them exist. `records` is the
 * concatenation of fixed 66-byte records in ascending action order:
 *   pool u8 (0x03 = Ironwood) | action_index u8 | signature [64 bytes]
 * The host applies each record with the pczt crate's
 * apply_orchard_spend_auth_signature, which verifies it against the indexed
 * action's rk and the host-computed sighash, so a record cannot be replayed
 * into another transaction, pool, or action index.
 * @end
 */
message ZcashSpendAuthSignatures {
    required bytes transfer_id = 1;  // the transfer the records belong to
    required bytes records = 2;      // n * 66 bytes, 1 <= n <= 32
}

/**
 * Request: The app's resource counters since the previous request (or since
 * it was loaded), for measuring it on a device. Debug builds only.
 * @start
 * @next ZcashDiagnostics
 */
message ZcashGetDiagnostics {
}

/**
 * Response: The app's resource counters; the request starts new ones.
 * @end
 */
message ZcashDiagnostics {
    required uint32 heap_size = 1;                 // bytes in the app heap
    required uint32 heap_used = 2;                 // bytes allocated now
    required uint32 heap_peak = 3;                 // most bytes allocated at once
    required uint32 max_ipc_silence_ms = 4;        // longest time Core waited for the app's next message
    required uint32 max_ipc_silence_service = 5;   // service of the message that ended it (5 = Progress)
    required uint32 ipc_sent = 6;                  // messages the app sent
}
