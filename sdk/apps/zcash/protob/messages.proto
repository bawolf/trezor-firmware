syntax = "proto2";
package hw.trezor.messages;

/**
 * Mapping between the Zcash app's wire identifiers and its protobuf messages
 */
enum MessageType {
    MessageType_ZcashGetAddress = 0;
    MessageType_ZcashAddress = 1;
    MessageType_ZcashGetViewingKey = 2;
    MessageType_ZcashViewingKey = 3;
    MessageType_ZcashSignPczt = 4;
    MessageType_ZcashPcztRequest = 5;
    MessageType_ZcashPcztAck = 6;
    MessageType_ZcashSpendAuthSignatures = 7;
    MessageType_ZcashCancel = 8;
    // Debug builds only (a release build stops on an unknown message).
    MessageType_ZcashGetDiagnostics = 9;
    MessageType_ZcashDiagnostics = 10;
}
