[package]
name = "zcash-signer"
version = "0.1.0"
edition = "2024"

[features]
# Computes the Sinsemilla generators instead of linking their table: less
# flash, slower signing.
computed-generators = ["sinsemilla/computed-generators"]

[dependencies]
aes = { version = "0.8.4", default-features = false, features = ["zeroize"] }
blake2b_simd = { version = "1.0.2", default-features = false, features = ["uninline_portable"] }
jubjub = { version = "0.10.0", default-features = false }
orchard = { version = "=0.15.3", default-features = false }
pasta_curves = { version = "0.5.1", default-features = false, features = ["alloc", "uninline-portable"] }
rand_core = { version = "0.6.4", default-features = false }
# Only to select its generator table.
sinsemilla = { version = "=0.1.0", default-features = false }
subtle = { version = "2.6.1", default-features = false }
zcash_note_encryption = { version = "0.4.1", default-features = false }
zcash_protocol = { version = "0.10.5", default-features = false }
zeroize = { version = "1.8.2", default-features = false, features = ["zeroize_derive"] }

[dev-dependencies]
rand_chacha = { version = "0.3.1", default-features = false }
