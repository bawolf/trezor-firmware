cargo-features = ["panic-immediate-abort"]

[package]
name = "zcash"
version = "0.1.0"
edition = "2024"

[package.metadata.trezor]
id = "zcash.trezor.com"
name = "Zcash"
vendor = "Bryant Wolf"
# Heap: a 32-action sign peaks at 56,522 B on the host (64-bit), 30,186 B of
# it the Pallas and orchard caches that stay for the app's life; receive peaks
# at 38,010 B. 72 KiB leaves ~16 KiB for fragmentation and the IPC and screen
# buffers. Stack: not measured on hardware yet, twice the samples' 16 KiB.
stack-size = 32768
heap-size = 73728
app-ring = 0
# The ZIP-32 Orchard account keys from Core's key service.
curves = ["zip32-orchard"]
paths = [
    "m/32'/133'/account'",
    "m/32'/1'/account'",
]

[dependencies]
trezor-app-sdk = { path = "../../crates/trezor-app-sdk" }
ironwood.workspace = true
orchard.workspace = true
prost = { version = "0.14.1", default-features = false, features = ["derive"] }
rand_core.workspace = true
# The SDK's log macros expand to ufmt calls.
ufmt = { version = "0.2.0", default-features = false }
zcash_address.workspace = true
zcash_protocol.workspace = true
zeroize.workspace = true

[build-dependencies]
prost-build = "0.14.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# --------------------------------------------------------------------------
# Model features
# --------------------------------------------------------------------------
model_t3t1 = []
model_t3w1 = []

# --------------------------------------------------------------------------
# Language features
# --------------------------------------------------------------------------
lang_en = []

# --------------------------------------------------------------------------
# Log level features
# --------------------------------------------------------------------------
log_level_error = ['trezor-app-sdk/log_level_error']
log_level_warn = ['trezor-app-sdk/log_level_warn']
log_level_info = ['trezor-app-sdk/log_level_info']
log_level_debug = ['trezor-app-sdk/log_level_debug']

# --------------------------------------------------------------------------
# Selectable features
# --------------------------------------------------------------------------
# No `test` feature: the SDK's mock needs `sha3` 0.11, whose `digest` cannot
# coexist with the pre-release `digest` the Zcash crates pin.
emulator = []
debug = ['trezor-app-sdk/debug']
# Computes the Sinsemilla generators instead of linking their table: smaller
# code, slower signing (the Safe 5 configuration of the firmware series).
computed-generators = ["ironwood/computed-generators"]

# --------------------------------------------------------------------------
# Automatically derived features (do not enable from outside)
# --------------------------------------------------------------------------
dev_keys = []

# The Zcash app is its own workspace: its Zcash dependencies need the
# pre-release `digest` 0.11 that the `sdk/apps` workspace cannot share with the
# SDK's mock `sha3` 0.11.
[workspace]
members = [".", "ironwood"]

resolver = "2"

# Dependency pins as in the source of the `ironwood` crate,
# bawolf/trezor-firmware@7864a22444 `core/embed/Cargo.toml`.
[workspace.dependencies]
aes = { version = "=0.8.4", default-features = false, features = ["zeroize"] }
blake2b_simd = { version = "=1.0.2", default-features = false, features = ["uninline_portable"] }
ironwood = { path = "ironwood", default-features = false }
ironwood-pasta-curves = { package = "pasta_curves", version = "=0.5.1", default-features = false, features = ["alloc", "uninline-portable"] }
ironwood-sinsemilla = { package = "sinsemilla", version = "=0.1.0", default-features = false }
orchard = { version = "=0.15.3", default-features = false }
pczt = { version = "=0.9.3", default-features = false, features = ["orchard"] }
rand_core = { version = "=0.6.4", default-features = false }
sapling = { package = "sapling-crypto", version = "=0.7.0", default-features = false }
transparent = { package = "zcash_transparent", version = "=0.10.0", default-features = false }
zcash_note_encryption = { version = "=0.4.1", default-features = false }
zcash_primitives = { version = "=0.30.1", default-features = false }
zcash_address = { version = "=0.13.0", default-features = false }
zcash_protocol = { version = "=0.10.5", default-features = false }
zeroize = { version = "1.8.2", default-features = false, features = ["zeroize_derive"] }
# Host-only (ironwood dev-dependencies).
rand_chacha = { version = "=0.3.1", default-features = false }
serde_json = "1.0.145"
zip32 = { version = "=0.2.1", default-features = false }

# Ironwood (Orchard v2) is not released upstream yet; these are the forks that
# source pins, by full commit.
[patch.crates-io]
sinsemilla = { git = "https://github.com/bawolf/sinsemilla", rev = "6ca88ff52835899c87ff83489b95c5cda887e8a4" }
orchard = { git = "https://github.com/bawolf/orchard", rev = "d4792911986deda16cc3d689a97f316655f08e84" }

[profile.debug-fw]
inherits = "dev"
split-debuginfo = "off"
debug = 2
strip = "none"
panic = "abort"

[profile.release-fw]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
split-debuginfo = "off"
debug = 0
debug-assertions = false
overflow-checks = false
incremental = false
panic = "immediate-abort"

[profile.test]
split-debuginfo = "off"
debug = 2
