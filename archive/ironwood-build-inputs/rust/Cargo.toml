[package]
name = "ironwood-emulator-bridge"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
autotests = false

[lib]
test = true
doctest = false

[[test]]
name = "lifecycle"
path = "tests/lifecycle.rs"

[workspace]
resolver = "3"

[dependencies]
pczt = { path = "../upstream/librustzcash/pczt", default-features = false, features = ["orchard"] }
ironwood-approval = { path = "../crates/approval", default-features = false }
orchard = { version = "=0.15.3", default-features = false, features = ["zeroize"] }
zeroize = { version = "=1.8.2", default-features = false }
rand_chacha = { version = "=0.3.1", default-features = false }
spin = { version = "=0.9.9", default-features = false, features = ["spin_mutex"] }

[dev-dependencies]
serde_json = "1"
